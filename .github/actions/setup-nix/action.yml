name: Setup Nix with Cachix
description: Setup Nix environment with Cachix configuration
inputs:
  signingKey:
    description: Cachix signing key
    required: false
  authToken:
    description: Cachix auth token
    required: false
runs:
  using: composite
  steps:
    - name: 🏗️ Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        extra_nix_config: |
          accept-flake-config = true
    - name: 🏗️ Setup cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: tolkonepiu
        signingKey: ${{ inputs.signingKey }}
        authToken: ${{ inputs.authToken }}
